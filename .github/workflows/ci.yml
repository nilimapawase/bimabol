name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker compose up --build -d
      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9080/ >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - run: docker compose down